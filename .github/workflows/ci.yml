name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub's default run shell is `bash -e {0}`, which takes a pipeline's status from its LAST command. With pipefail a
# CLI that prints the expected line and then exits non-zero fails the smoke step instead of going green via `tee`.
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The name is load-bearing: the branch ruleset requires exactly this string.
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: this slice's CI needs none, and no step reads any.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `--locked`, not `--frozen`: `--frozen` installs from the lock WITHOUT checking it still
      # matches pyproject.toml, so a dependency added and never relocked passes CI and is then
      # simply absent at deploy, because the Dockerfile installs the locked set. Measured:
      # adding httpx without relocking left `--frozen` at exit 0 and every step green.
      - run: uv sync --locked
      # `--frozen` on each `uv run` too: without it, `uv run` silently REWRITES uv.lock in the
      # tree and resolves the addition from PyPI, so the job both hides the error and mutates
      # the file it was meant to be validating.
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy --strict
      - run: uv run --frozen pytest
      - name: Build the package
        # `python -P`, not a bare `python -c`: this step runs with the checkout root as cwd, and
        # without -P the script directory (here, "") goes on sys.path FIRST, so `import workbench`
        # resolves to ./workbench -- the source tree -- and the step cannot fail however broken the
        # wheel is. Measured on this branch: a bare -c imported
        # /var/tmp/.../20-discovery-workbench/workbench/__init__.py, and -P imported
        # /tmp/wheel-check/lib/python3.12/site-packages/workbench/__init__.py. Only the second is
        # a proof that the wheel installs and imports, which is what this step claims to be.
        run: |
          uv build
          uv venv --python 3.12 /tmp/wheel-check
          # A wheel carries no [tool.uv.sources], so the pinned app 17 tag comes from the lockfile.
          uv export --quiet --frozen --no-dev --no-emit-project --no-hashes -o /tmp/runtime-reqs.txt
          uv pip install --python /tmp/wheel-check/bin/python -r /tmp/runtime-reqs.txt
          uv pip install --python /tmp/wheel-check/bin/python --no-deps dist/*.whl
          /tmp/wheel-check/bin/python -P -c "import workbench, workbench.core, agent_container"
          # The package data the store needs must be IN the wheel, not merely next to it in the
          # checkout -- a .sql file left out of the build is a container that starts and then fails
          # on its first query.
          /tmp/wheel-check/bin/python -P -c "from workbench.core import store; \
            assert store._SCHEMA_PATH.is_file() and store._SEED_PATH.is_file()"
          # The same for the committed recordings. The demo and the replay provider read these,
          # so a .json left out of the build is a wheel whose `wb demo` fails at the first reply
          # while every test in the checkout still passes.
          # One assertion each, carrying the path: a bare AssertionError over both would not say
          # which recording the build dropped.
          /tmp/wheel-check/bin/python -P -c "from workbench.cli import discover; \
            assert discover.FIXTURE.is_file(), discover.FIXTURE"
          /tmp/wheel-check/bin/python -P -c "from workbench.readout import synthesis; \
            assert synthesis.FIXTURE.is_file(), synthesis.FIXTURE"
      - name: Smoke test (installed CLI)
        # PYTHONSAFEPATH is the console script's `-P`. Belt and braces rather than a fix: a
        # console script's own sys.path[0] is /tmp/wheel-check/bin, never the checkout root, so
        # this step was already proving the installed CLI. It costs nothing and removes the need
        # to re-derive that for the next person who moves this step.
        env:
          PYTHONSAFEPATH: "1"
        run: |
          /tmp/wheel-check/bin/wb --version | tee smoke.out
          grep -q "^wb 0.1.0$" smoke.out

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: wb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI in the image
        # Overrides CMD (now `serve`), so this still proves the entry point and the version.
        run: docker run --rm wb:ci --version | grep -q "^wb 0.1.0$"
      - name: The image serves with no arguments
        # The gap this closes: six slices merged with an image whose CMD printed a version and
        # exited, and nothing anywhere noticed. On that image the container is gone before the
        # first curl, so the retry loop runs out and `curl -fsS` fails the step.
        #
        # This job is the only place the container itself is exercised; it was written without a
        # Docker daemon available, so the image half is proven by this job's own first green run
        # and not by a local one. What WAS measured locally, on the installed CLI: `wb serve`
        # with no arguments prints `listening: http://0.0.0.0:8080/` and answers both routes,
        # `PORT=9123 wb serve` listens on 9123, and `scripts/smoke.sh --url` passes against it.
        # `tests/test_image.py` pins the Dockerfile directives those two facts combine with.
        run: |
          # 3000 is the image's PORT, which is what the Lambda adapter forwards to.
          id=$(docker run -d -p 8080:3000 wb:ci)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # `--fail` so a 500 from a broken replay round-trip is a failure, not a logged body.
          health=$(curl -fsS --max-time 10 http://127.0.0.1:8080/healthz)
          grep -q "^version: 0.1.0$" <<<"$health"
          grep -q "^replay: ok$" <<<"$health"
          # The platform health path, in the image. deploy/aws.sh curls this one, not /healthz.
          alias_health=$(curl -fsS --max-time 10 http://127.0.0.1:8080/api/health)
          [ "$alias_health" = "$health" ]
          map=$(curl -fsS --max-time 10 http://127.0.0.1:8080/)
          grep -q $'^5\.6\t' <<<"$map"
          # Still running after being served, i.e. serve_forever rather than one reply and exit.
          test "$(docker inspect -f '{{.State.Running}}' "$id")" = true
      - name: The image carries the Lambda Web Adapter
        # The image deploys as a package_type="Image" Lambda and cannot initialise without the
        # adapter (issue #29). tests/test_image.py pins the Dockerfile line; this proves the
        # file is actually in the built image and executable, which the Dockerfile cannot.
        run: |
          docker run --rm --entrypoint sh wb:ci -c \
            'test -x /opt/extensions/lambda-adapter'
      - name: The image takes its port from PORT
        run: |
          # Overrides the image's PORT=3000, proving the env var still wins.
          id=$(docker run -d -e PORT=9123 -p 9123:9123 wb:ci)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:9123/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 10 http://127.0.0.1:9123/healthz | grep -q "^replay: ok$"
