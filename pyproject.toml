[project]
name = "discovery-workbench"
version = "0.1.0"
description = "Discovery workbench: a coordinator that fans scoped questions out to parallel subagents on the agent container, with verbatim provenance for every claim."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # App 17 (the agent container) is pinned by git TAG, never a branch or a bare commit. v0.1.1 is an annotated tag
    # on 8b3d030. A slice that needs something later than this tag stops and comments on its issue.
    # Moving this pin means regenerating uv.lock, because the lock records the resolved COMMIT, not
    # the tag. Three things catch a bump made here without `uv lock`: this repo's CI runs
    # `uv sync --locked` (which validates the lock against this file; `--frozen` would not, which is
    # 17-agent-container#16) and `uv run --frozen` on every step, and tests/test_app17_pin.py asserts
    # the installed commit. Update that test's PIN_TAG and PIN_COMMIT in the same change.
    "agent-container",
]

[project.scripts]
wb = "workbench.cli:main"

[tool.uv.sources]
agent-container = { git = "https://github.com/BreakthruDevelopment/17-agent-container", tag = "v0.1.1" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of a test file.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
# The pack generator lives under sources/acme-p2p/ and is not an importable package
# (the directory name is hyphenated). It is still held to this strict check.
files = ["workbench", "tests", "sources/acme-p2p/generate.py"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A hung test fails after 60 s instead of stalling the run.
timeout = 60
